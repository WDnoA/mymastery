name: mymastery
description: "我的精通 - 个人资产管理App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  riverpod_annotation: ^4.0.0
  go_router: ^14.0.0
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3_web: ^0.9.0
  path_provider: ^2.1.0
  path: ^1.9.0
  intl: ^0.19.0
  sqlite3: ^3.5.0
  shared_preferences: ^2.5.0
  package_info_plus: ^9.0.0
  flutter_secure_storage: ^9.2.0
  crypto: ^3.0.3
  fl_chart: ^0.68.0
  share_plus: ^10.0.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
